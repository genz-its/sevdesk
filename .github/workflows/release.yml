name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write # Required for npm OIDC trusted publishing
  issues: write
  pull-requests: write

env:
  NODE_VERSION: 24

jobs:
  release:
    if: github.repository == 'genz-its/sevdesk'
    runs-on: ubuntu-latest
    steps:
      - name: Create release pull request or GitHub release
        id: release-please
        uses: googleapis/release-please-action@v4
      - uses: actions/checkout@v4
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Update npm for OIDC trusted publishing
        if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        run: npm install -g npm@latest
      - if: ${{ steps.release-please.outputs.releases_created == 'true' }}
        run: npm ci
      - name: Publish @genz-its/sevdesk-sdk to npm
        if: ${{ steps.release-please.outputs['packages/sdk--release_created'] == 'true' }}
        run: npm publish --workspace @genz-its/sevdesk-sdk
      - name: Publish @genz-its/sevdesk-cli to npm
        if: ${{ steps.release-please.outputs['packages/cli--release_created'] == 'true' }}
        run: npm publish --workspace @genz-its/sevdesk-cli
