name: Release

# release-please maintains the release pull request, the changelog and the
# version bumps. When that pull request is merged it tags `vX.Y.Z` and creates
# the GitHub release; the assets job then builds, verifies and attaches the
# tarballs. Nothing is published to npm.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'mi-skam/sevdesk'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Maintain release pull request and release
        id: release
        uses: googleapis/release-please-action@v4

  assets:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
